name: Offline source and demo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-demo.txt
      - run: python tools/check_source.py
      - run: python -m unittest discover -s tests -v
      - run: python demo.py --query "imaging reporting"
